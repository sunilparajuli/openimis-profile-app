name: openimis_web_app
description: "OpenIMIS extension as Mobile Application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.5+19
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.6.0
  provider: ^6.1.5+1
  path_provider : ^2.0.0
  flutter_cache_manager : ^3.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  fluttertoast: ^9.0.0
  intro_views_flutter:
  local_auth: ^2.3.0
  cached_network_image: ^3.0.0
  curved_navigation_bar: ^1.0.6 #latest version
  circular_profile_avatar: ^2.0.0
  awesome_dialog: ^3.3.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1

  getwidget: ^7.0.2
  qr_flutter: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_map:
  flutter_map_marker_cluster:
  image_cropper: ^12.2.1
  latlong2:
  flutter_dotenv: ^5.2.1

  path: any
  http_parser: any
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/hib-logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  assets:
    - .env
    - assets/images/100-welcome.png
    - assets/images/smcard/
    - assets/images/
    - assets/ca/
    - assets/locale/localization_en.json
    - assets/locale/localization_np.json
    - assets/json/offices.json
    - assets/json/faqs.json
    - assets/json/contacts.json


  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
        - asset: assets/fonts/Montserrat-Regular.ttf
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
